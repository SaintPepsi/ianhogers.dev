  'get up':          { c: '#ff922b', l: ['get up'], v: 25, fx: 'rise', drive: 1 },
  wander:            { c: '#ffd166', l: ['wander'], v: 77, fx: 'warp', golden: true, once: true },

for (const w of ['what if', 'dream big', 'leap', 'say yes', 'wonder', 'adventure'])
  T[w] = { c: '#ffcf4a', l: [w], v: 45, fx: pick(['warp', 'burst', 'bloom']), golden: true, once: true, secret: true };

Object.assign(T.cook, { ev: ['burnt'] }); Object.assign(T.sleep, { ev: ['insomnia'] });
Object.assign(T.walk, { ev: ['raining'] }); Object.assign(T.library, { ev: ['closed'] });

/* Life threads. Doors feed four slow goals, each shown by a keepsake in the world:
   career builds a staircase behind you, health grows a tree on your left, heart gathers
   lanterns that orbit you, wonder pins stars into the sky. Threads lean on each other:
   health is your energy for heavy doors, heart gets you through locked ones. */
const THREAD = { career: { c: '#ffd84a', g: 8 }, health: { c: '#4cd28a', g: 6 }, heart: { c: '#ff6f91', g: 5 }, wonder: { c: '#b388ff', g: 7 } };

  career: ['study', 'exam', 'graduate', 'work', 'overtime', 'promotion', 'retrain', 'freelance', 'new career'],
  health: ['health', 'walk', 'breathe', 'rest', 'sleep'],
  heart: ['family', 'hug', 'friends', 'cook', 'ask for help'],
  wonder: ['read', 'library', 'music', 'travel', 'learn', 'build something', 'move city', 'start again'],

for (const k in T) if (T[k].golden) T[k].t = 'wonder';
Object.assign(T.graduate, { lock: 'exam' }); Object.assign(T.promotion, { lock: 'graduate' }); Object.assign(T['new career'], { lock: 'learn' });

const REFRAME = { rejected: 'redirected', fired: 'fired up', failed: 'failed forward', redundant: 'redesigned', replaced: 'replanted', burnout: 'burn bright',
  injured: 'in recovery', closed: 'clear', 'out of coffee': 'out for coffee', cancelled: 'can do', grounded: 'grow', offline: 'off outside', 'moved away': 'move too',

const CALM = ['rest', 'family', 'hug', 'health', 'breathe', 'walk', 'friends', 'sleep', 'ask for help'];

const stats = {};

/* ------------------------------------------------------------------ audio */
const A = {
  ctx: null, master: null, verb: null, sfx: null, music: null, noise: null,
  muted: (() => { try { return localStorage.getItem('one-door-muted') === '1'; } catch { return false; } })(),
  init() {

    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const nd = nb.getChannelData(0);

  impulse(sec, decay) {

  setMuted(m) {

  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  osc(type, f, t, dur, peak, a = 0.005, dest = this.sfx, f2) {

  ok() { return this.ctx && this.ctx.state === 'running'; },
  key(g = 1) { if (!this.ok()) return; const t = this.ctx.currentTime;
    this.hiss(t, 0.03, 0.09, 'bandpass', rand(2600, 4200) * (0.9 + g * 0.1), 1.4);

  nope() { if (!this.ok()) return; const t = this.ctx.currentTime; this.osc('sine', 150, t, 0.16, 0.09, 0.004, this.sfx, 85); },
  open() { if (!this.ok()) return; const t = this.ctx.currentTime;

    const o = this.ctx.createOscillator(), bp = this.ctx.createBiquadFilter(), g = this.ctx.createGain();

  slam() { if (!this.ok()) return; const t = this.ctx.currentTime;

    top.postMessage({
      type: "pixel-cursor", kind,
      x: e ? e.clientX : 0, y: e ? e.clientY : 0,
      clickable: !!(t && t.closest("a, button, [role=button], input, select, textarea, label")),
      draggable: !!(t && t.closest("[draggable=true]")),
    }, "*");
  };
  document.addEventListener("mousemove", e => post("move", e), { passive: true });
  document.addEventListener("mousedown", e => post("down", e), { passive: true });
  document.addEventListener("mouseup",   e => post("up", e),   { passive: true });
  document.addEventListener("mouseleave", () => post("leave"));
}
</script>
</body>
</html>
