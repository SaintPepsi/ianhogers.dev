    }

function exitTransit() {

  if (tr.inst) { tr.group.remove(tr.inst); tr.inst.material.dispose(); tr.inst.dispose(); tr.inst = null; }

/* ------------------------------------------------------------------ palette */
const P = {
  calmTop: new THREE.Color('#8e9cff'), calmHor: new THREE.Color('#ffd3c0'), calmBot: new THREE.Color('#c7b6ff'),
  roughTop: new THREE.Color('#120914'), roughHor: new THREE.Color('#6e2433'), roughBot: new THREE.Color('#1c0f1c'),
  floor: new THREE.Color('#dccdff'), floorRough: new THREE.Color('#3b2638'),
  hemiSky: new THREE.Color('#ffe9f0'), hemiRough: new THREE.Color('#ff8a7a'),
};
const tint = new THREE.Color('#ffd3c0'), _c = new THREE.Color();
function paint(dt) {
  if (transit.on) {
    const c = transit.col;
    skyU.top.value.copy(c).multiplyScalar(0.25); skyU.hor.value.copy(c).lerp(P.calmHor, 0.25); skyU.bot.value.copy(c).multiplyScalar(0.4);
    scene.fog.color.copy(skyU.hor.value).multiplyScalar(0.85);

  }

  skyU.top.value.copy(P.calmTop).lerp(P.roughTop, r);
  skyU.hor.value.copy(P.calmHor).lerp(tint, 0.18).lerp(P.roughHor, r);
  skyU.bot.value.copy(P.calmBot).lerp(P.roughBot, r);
  scene.fog.color.copy(skyU.hor.value);
  floorMat.color.copy(P.floor).lerp(P.roughBot.clone().lerp(P.floorRough, 0.6), r);
  hemi.color.copy(P.hemiSky).lerp(P.hemiRough, r * 0.7); hemi.intensity = 0.7 - r * 0.3;
  sun.intensity = 1.3 - r * 0.6;
}

/* ------------------------------------------------------------------ loop */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  U.uTime.value += dt;
  runTweens(dt);
  rough += (roughTarget - rough) * Math.min(1, dt * (roughTarget > rough ? 6 : 0.7));
  U.uRough.value = rough;
  shake = Math.max(0, shake - dt * 1.4);
  swayX += (mx * -0.07 - swayX) * Math.min(1, dt * 2); swayY += (my * -0.04 - swayY) * Math.min(1, dt * 2);
  if (transit.on) updateTransit(dt);
  const sh = shake * shake;
  camera.position.set(camPos.x + rand(-1, 1) * sh * 0.25, camPos.y + rand(-1, 1) * sh * 0.2, camPos.z);
  camera.rotation.set(pitch + swayY + rand(-1, 1) * sh * 0.03, yaw + (transit.on ? 0 : swayX), transit.on ? Math.sin(transit.t * 0.8) * 0.06 : rand(-1, 1) * sh * 0.03);
  sky.position.copy(camera.position);
  paint(dt);
  const t = U.uTime.value;
  for (const d of doors) {
    const target = d.prefix > 0 || d.freeText ? 1 : 0;
    d.hot = Math.max(target, d.hot - dt * 3);
    d.group.position.y = d.rise + Math.sin(t * 0.8 + d.ph) * 0.04;
    d.group.rotation.z = Math.sin(t * 0.5 + d.ph) * 0.012 + (d.slammed ? 0.04 : 0);
    const s = d.scale * (1 + Math.min(1, d.hot) * 0.035); d.group.scale.setScalar(s);
    const on = d.slammed ? 0.15 + Math.random() * 0.1 * rough : Math.min(1, d.hot);
    d.bulbMat.emissive.copy(d.slammed ? _c.set('#ff2a2a') : d.color).multiplyScalar(on * 2.2);
  }
  for (const f of floaters) {
    const u = f.userData; f.position.y = u.y + Math.sin(t * u.sp + u.ph) * 0.8; f.rotation.y += u.rs * dt; f.rotation.x += u.rs * 0.5 * dt;
  }

}

/* ------------------------------------------------------------------ input */
const ti = $('ti'), SENT = '_';
ti.value = SENT;

});

});
addEventListener('keydown', (e) => {

});
addEventListener('pointerdown', (e) => { A.init(); if (!e.target.closest('#ctrl')) setTimeout(focusInput, 0); });
addEventListener('pointermove', (e) => { mx = (e.clientX / innerWidth) * 2 - 1; my = (e.clientY / innerHeight) * 2 - 1; }, { passive: true });
addEventListener('resize', resize);
function dismissTitle() { $('title').classList.add('gone'); }

const muteBtn = $('muteBtn');
const showMute = () => { muteBtn.classList.toggle('on', A.muted); $('waves').style.display = A.muted ? 'none' : ''; };
muteBtn.addEventListener('click', () => { A.init(); A.setMuted(!A.muted); showMute(); focusInput(); });
showMute();

// voice: say the word instead of typing it
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const micBtn = $('micBtn'); micBtn.hidden = false;
  let rec = null, on = false;
  const stop = () => { on = false; micBtn.classList.remove('on'); try { rec && rec.stop(); } catch {} };
  micBtn.addEventListener('click', () => {
    A.init();
    if (on) return stop();
    rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (ev) => {
      const r = ev.results[ev.results.length - 1], text = r[0].transcript;
      if (!r.isFinal) { if (!busy) { const b = $('buf'); b.className = 'voice'; b.textContent = text.toLowerCase(); } return; }
      $('buf').className = ''; $('buf').textContent = '';

    };
    rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') stop(); };

}

  dismissTitle();

  const vd = visibleDoors().filter((d) => !d.free);
